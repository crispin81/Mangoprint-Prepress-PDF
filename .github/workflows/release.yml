# Builds the macOS and Linux installers and attaches them to a DRAFT
# GitHub Release (only visible to the repo owner) for testing before they
# go public. Run it from the Actions tab: "release-mac-linux" -> "Run workflow".
# Windows releases are built on Windows with Ghostscript bundled.
name: release-mac-linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the draft release'
        default: 'v0.1.0-beta-mac-linux'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: build bundled Ghostscript (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: bash .github/scripts/build-ghostscript-linux.sh

      - name: install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential rpm

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install frontend dependencies
        run: npm install

      - name: install patched linuxdeploy gtk hook (native Wayland fix)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p ~/.cache/tauri
          cp .github/appimage/linuxdeploy-plugin-gtk.sh ~/.cache/tauri/linuxdeploy-plugin-gtk.sh
          chmod +x ~/.cache/tauri/linuxdeploy-plugin-gtk.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag }}
          releaseName: 'Mangoprint Prepress PDF macOS & Linux (testing)'
          releaseBody: 'Test builds for macOS and Linux. Not public until published. Ghostscript is bundled on Linux; on macOS install it with Homebrew.'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
