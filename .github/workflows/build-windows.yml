# Builds the Windows installers on GitHub's machines (no release). Run it
# from the Actions tab ("build-windows" -> "Run workflow"); the installers appear
# as downloadable artifacts at the bottom of the finished run. Each platform
# has its own workflow so they never rebuild each other.
name: build-windows

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows
            args: ''
            bundle: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/mangoprint-prepress-pdf.exe

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: build bundled Ghostscript (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: bash .github/scripts/build-ghostscript-linux.sh

      - name: build bundled Ghostscript (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash .github/scripts/build-ghostscript-macos.sh

      - name: install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential rpm

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm install

      - name: install patched linuxdeploy gtk hook (native Wayland fix)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p ~/.cache/tauri
          cp .github/appimage/linuxdeploy-plugin-gtk.sh ~/.cache/tauri/linuxdeploy-plugin-gtk.sh
          chmod +x ~/.cache/tauri/linuxdeploy-plugin-gtk.sh

      - name: bundle Ghostscript (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = 'gs10080'
          Invoke-WebRequest "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/$ver/${ver}w64.exe" -OutFile gs.exe
          # Unpack the installer with 7-Zip instead of running it: the silent
          # install can hang on GitHub's machines (4 Nov 2026 run sat here for an hour).
          7z x gs.exe -ogsx -y | Out-Null
          $exe = Get-ChildItem gsx -Recurse -Filter gswin64c.exe | Select-Object -First 1
          $dll = Get-ChildItem gsx -Recurse -Filter gsdll64.dll | Select-Object -First 1
          $lic = Get-ChildItem gsx -Recurse -Filter COPYING | Select-Object -First 1
          if (-not $exe -or -not $dll -or -not $lic) { throw "Ghostscript files not found in the installer" }
          New-Item -ItemType Directory -Force src-tauri\ghostscript\bin | Out-Null
          Copy-Item $exe.FullName,$dll.FullName src-tauri\ghostscript\bin
          Copy-Item $lic.FullName src-tauri\ghostscript\COPYING.txt
          Copy-Item .github\ghostscript-README.txt src-tauri\ghostscript\README.txt

      - name: unit tests
        if: matrix.platform != 'macos-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: build installers
        run: npm run tauri build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: Mangoprint-${{ matrix.name }}
          path: ${{ matrix.bundle }}
